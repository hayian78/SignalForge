    - modelcontextprotocol/specification
  # Live (2026-08-16): `ingest/awesome.py` fetches each README and emits only
  # entries added since the last run — a diff, not a scrape. The *first* run for
  # a list records its baseline and emits nothing at all, so adding a list here
  # never floods triage with its back catalogue.
  #
  # `awesome_max_new_per_run` is required whenever this block is non-empty. A
  # list entry carries no date, so `defaults.max_item_age_days` cannot bound it
  # and this is the only thing between a maintainer's 300-entry merge and a
  # 300-item triage batch. Excess is logged, never dropped silently.
  awesome_max_new_per_run: 25
  awesome_lists:
    - punkpeye/awesome-mcp-servers
    # Dropped 2026-08-16 on measurement, not taste: this list documents each
    # project as an `### Heading` followed by a bullet list of its links, so a
    # bullet-entry diff reads it as 621 "entries" titled GitHub (x92), Web
    # (x81), Discord (x51) and Twitter (x37). The repeated-label filter in
    # `ingest/awesome.py` removes most of that, but the 138 survivors are still
