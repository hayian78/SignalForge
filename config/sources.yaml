# --------------------------------------------------------------------------- #
# Adaptive source curation (DESIGN §7.1) — meta-config, not a source.
#
# `signalforge curate run` (weekly) reads per-source yield from the stored corpus,
# searches the live web for where attention has moved, and proposes edits to THIS
# file. Proposals surface as tick-boxes at the foot of the next daily digest;
# approved ones are applied by `signalforge curate apply` at the start of the
# following morning's run, before ingest, so a feed approved yesterday is fetched
# today. `signalforge curate list` and `curate decide <id> approve|reject --note`
# are the terminal equivalents of the tick-boxes.
#
# Nothing here changes a source without a tick, and every applied change lands as
# an uncommitted git diff on this file for review. `interests.yaml` is never
# proposed against — what the operator cares about is a deliberate choice; where
# it comes from is a fact about the world.
#
# Delete this block to turn the feature off; `curate run` will say so and exit
# rather than invent its own spend caps, and `curate apply` drops out of the daily
# chain entirely.
curation:
  # At most N proposals per run — one week cannot rewire the feed.
  max_proposals_per_run: 5

  # The money knob: web search is billed per call, not per token (DESIGN §8), so
  # this caps the one line of curation spend that token counts don't show. Turn
  # this first if the *search* figure in `signalforge status` surprises you. Set
  # to 0 to keep the scout entirely inside the stored corpus, which costs nothing
  # beyond the one Opus call.
  #
  # Raised 6 -> 7 -> 12 on 2026-07-31, in that order, same day. 6 -> 7 came after
  # the first real run measured ~30k input tokens per search — 5x the "pessimistic"
  # 6k/search this feature's original $2.50/month budget assumed. 7 -> 12 is the
  # operator's own call, made after comparing the 6- and 7-search runs directly and
  # judging the extra research depth worth paying for ("a dollar a run is still
  # under a cup of coffee a month") — not more proposals, `max_proposals_per_run`
  # above is unchanged, but more grounding behind each one. `llm.py`'s
  # SCOUT_MAX_SEARCHES_CEILING and SCOUT_MONTHLY_CEILING_USD were raised alongside
  # this to $13/month, the real worst case at 12 searches priced with margin above
  # (not at) the highest of three real runs — this feature can now cost as much as
  # the rest of the pipeline combined, still trivial against the $50 overall alarm.
  # Re-check `signalforge status` after a few more runs; this is still an experiment.
  max_searches_per_run: 12

  # Lookback for the yield stats that justify a retirement.
  yield_window_days: 30

  # How long a decided proposal keeps rendering as a settled one-liner, counted
  # from the day it first surfaced, so re-reading an old digest still shows what
  # was approved that week.
  settled_display_days: 14
