# The topic tree for the deterministic first-pass tagger (DESIGN §10).
#
# Two levels deep: a group (e.g. `industry`) contains leaves (e.g. `strategy`),
# each carrying the lowercase keywords a match is decided on. Live since
# 2026-08-16: `signalforge score` runs `score/taxonomy.py` over every untagged
# item and stores matches in `item_topics`, and the daily digest renders them as
# nested Obsidian tags (`industry.strategy` -> `#industry/strategy`).
#
# Matching is bounded, not substring — a keyword cannot match inside a longer
# word — and case-insensitive, over title + summary.
#
# IMPORTANT: editing an *existing* leaf's keywords changes what an already
# stored tag means, so bump `TAXONOMY_VERSION` in score/taxonomy.py when you do
# (the same discipline `RUBRIC_VERSION` has). Adding a brand-new leaf needs no
# bump. A bump re-tags everything on the next `score` run.
#
# `signalforge status` will name any leaf that has matched nothing in
# `taxonomy_stale_days` (settings.yaml, default 60) — that is the signal to
# rewrite its keywords or drop it.
#
# Deliberately minimal for now: exactly the six `group.leaf` pairs
# `interests.yaml`'s `priority_topics` already names (that file's own comment
# points here, and a shipped-config test enforces the two stay in sync). Every
# keyword below is traceable to operator-authored config — nothing invented.
# Sibling leaves (e.g. a second leaf under `agents` for tool use, or a
# `models`/`engineering` group) are a real gap, but choosing what belongs in
# an operator's own relevance vocabulary is an editorial call for the operator
# to make, not one for an assistant to invent wholesale — the same reason
# `curate/`'s scout proposals require a human tick before they land (§7.1)
# rather than writing straight to `sources.yaml`. Add leaves the same way you'd
# add a `priority_topics` entry: here, plus there.

# Widened 2026-08-16 against the stored corpus. The original six leaves carried
# only multi-word phrases ("competitive positioning", "deployment at scale")
# that real headlines do not contain verbatim: measured coverage was 3.9% of
# 2,082 items, and `status` flagged five of six leaves stale on day one. Each
# keyword below was counted against the real corpus before being added; the set
# lifts coverage to 23.5% with no single leaf swamping the rest.
#
# Deliberately NOT added, and why:
#   `claude` / `gemini` / `llama` (151/51/67 hits) — a vendor name is not a
#     capability claim; these tag every routine release note.
#   `research` (91) / `architecture` (64) — generic English in this corpus;
#     `architecture` matches software-architecture posts, not research agendas.
#   `production` (22) — "in production" is kept, the bare word is not: it also
#     means "video production" and "produced by".

industry:
  strategy:
    keywords: [market strategy, competitive positioning, business model, go-to-market,
               acquisition, funding round, valuation, ipo, partnership, revenue,
               market share, pricing, monetization, strategy]

frontier:
  capabilities:
    keywords: [frontier model, state of the art, benchmark record, capability jump,
               frontier, benchmark, sota, outperforms, reasoning model, context window,
               multimodal, model release]

enterprise:
  adoption:
    keywords: [enterprise adoption, rollout, deployment at scale, procurement, pilot program,
               enterprise, adoption, deployment, in production, case study, migration, customers]

agents:
  autonomy:
    keywords: [autonomous agent, agentic, agent autonomy, self-directed, long-horizon task,
               agent, autonomous, multi-agent, orchestration, tool use, mcp, long-horizon]

policy:
  regulation:
    keywords: [regulation, ai act, executive order, export control,
               regulatory, ai policy, compliance, governance, antitrust, copyright, lawsuit]

ai:
  research-direction:
    keywords: [research direction, research agenda, roadmap, position paper,
               paper, arxiv, preprint, survey, scaling law, interpretability, benchmark suite]
